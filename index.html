<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typo Trail</title>
<meta name="description" content="Editor foto typography bergaya poster pendakian. Unggah foto, pilih gaya, ubah teks, simpan PNG.">
<meta name="theme-color" content="#1f6f54">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&family=Pinyon+Script&family=Playfair+Display:ital,wght@1,700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Typo Trail</h1>
    <p>Taruh foto pendakianmu, pilih gaya tulisan, ubah teksnya, lalu simpan sebagai gambar 1080 × 1350.</p>
  </header>

  <div class="app">
    <div class="stage">
      <canvas id="cv" width="1080" height="1350" role="img" aria-label="Pratinjau foto typography"></canvas>
      <p class="hint" id="hint">Foto contoh. Unggah fotomu untuk mengganti.</p>
    </div>

    <div class="controls">
      <section class="group">
        <h2>Foto</h2>
        <div class="row">
          <label class="file-btn" for="file">Unggah foto<input id="file" type="file" accept="image/*"></label>
          <button type="button" id="resetPhoto">Atur ulang posisi</button>
        </div>
        <div class="sliders">
          <div><label for="zoom">Perbesar</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div>
          <div><label for="px">Geser kiri / kanan</label><input id="px" type="range" min="-1" max="1" step="0.01" value="0"></div>
          <div><label for="py">Geser atas / bawah</label><input id="py" type="range" min="-1" max="1" step="0.01" value="0"></div>
          <div><label for="dark">Gelapkan foto</label><input id="dark" type="range" min="0" max="0.9" step="0.01" value="0.35"></div>
        </div>
      </section>

      <section class="group">
        <h2>Gaya <span id="tplCount"></span></h2>
        <div class="tpl-grid" id="tpls"></div>
      </section>

      <section class="group">
        <h2>Teks</h2>
        <div class="fields" id="fields"></div>
        <div class="row tabrow" id="tabRow">
          <span>Tab aktif</span>
          <button type="button" data-tab="0" aria-pressed="false">Journey</button>
          <button type="button" data-tab="1" aria-pressed="true">Adventure</button>
          <button type="button" data-tab="2" aria-pressed="false">Healing</button>
        </div>
        <div class="sliders">
          <div><label for="size">Ukuran judul</label><input id="size" type="range" min="0.6" max="1.3" step="0.01" value="1"></div>
        </div>
        <div class="swatch-wrap">
          <div class="swatch-label">Warna aksen</div>
          <div class="swatches" id="swatches" role="radiogroup" aria-label="Warna aksen"></div>
        </div>
      </section>

      <section class="group">
        <h2>Simpan</h2>
        <div class="row"><button type="button" class="primary" id="save">Simpan PNG</button></div>
        <p class="status" id="status" aria-live="polite"></p>
      </section>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
